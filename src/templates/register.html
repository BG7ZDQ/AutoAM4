<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>注册 - AM4 机队中心</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--t:#1c2430;--t3:#8a93a3;--pri:#2563eb;--brd:#e2e6ef}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--t);
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:var(--card);border:1px solid var(--brd);border-radius:14px;box-shadow:0 8px 28px rgba(20,30,60,.08);
  padding:28px;width:100%;max-width:400px}
h1{font-size:1.25rem;margin-bottom:4px}
p.sub{color:var(--t3);font-size:.85rem;margin-bottom:18px}
label{display:block;font-size:.85rem;color:var(--t3);margin:10px 0 4px}
input{width:100%;padding:10px 12px;border:1px solid var(--brd);border-radius:8px;font-size:1rem;outline:none}
input:focus{border-color:var(--pri)}
button{width:100%;margin-top:18px;padding:11px;border:0;border-radius:8px;background:var(--pri);color:#fff;
  font-size:1rem;cursor:pointer}
button:hover{filter:brightness(1.05)}
.msg{font-size:.85rem;min-height:1.2em;margin-top:10px}
.msg.ok{color:#16a34a}.msg.err{color:#dc2626}
.ferr{display:none;color:#dc2626;font-size:.75rem;margin:4px 2px 0;min-height:1em}
.ferr.show{display:block}
.divider{border-top:1px dashed var(--brd);margin:18px 0 6px}
.verify{width:100%;margin-top:12px;padding:9px;border:1px solid var(--brd);border-radius:8px;
  background:transparent;color:var(--t);font-size:.9rem;cursor:pointer}
.verify:hover{filter:brightness(1.05)}
.verify:disabled{opacity:.6;cursor:default}
.vmsg{font-size:.8rem;min-height:1.2em;margin-top:8px}
.link{margin-top:14px;text-align:center;font-size:.85rem;color:var(--t3)}
.link a{color:var(--pri);text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <h1>注册账户</h1>
  <p class="sub">注册后请等待管理员审核。</p>
  <label>用户名</label>
  <input id="u" autocomplete="username" autofocus>
  <div class="ferr" id="uerr"></div>
  <label>密码（≥6 字符）</label>
  <input id="p" type="password" autocomplete="new-password">
  <label>确认密码（再次输入）</label>
  <input id="p2" type="password" autocomplete="new-password">
  <div class="divider"></div>
  <label>AM4 游戏账号（邮箱）</label>
  <input id="e" autocomplete="off" placeholder="your@example.com">
  <label>AM4 游戏密码</label>
  <input id="pw" type="password" autocomplete="new-password">
  <button type="button" class="verify" id="verifyBtn" onclick="verifyAm4()">验证 AM4 账号（可选）</button>
  <div class="msg vmsg" id="vmsg"></div>
  <div class="msg" id="msg"></div>
  <button onclick="reg()">提交注册</button>
  <div class="link">已有账号？<a href="/login">登录</a></div>
</div>
<script>
const CSRF = "{{ csrf_token }}";
const USER_RE = /^[A-Za-z0-9 _/]{2,8}$/;
const USER_HINT = '仅允许 2~8 位字母或数字，可含 _ / 或空格（头尾除外）';
function err(text){const m=document.getElementById('msg');m.className='msg err';m.textContent=text;}
function clearErr(){const m=document.getElementById('msg');m.className='msg';m.textContent='';}
function showUErr(text){const e=document.getElementById('uerr');e.textContent=text||'';e.classList.add('show');}
function hideUErr(){const e=document.getElementById('uerr');e.textContent='';e.classList.remove('show');}
// 用户名实时校验：标签不展示格式限制，只在输入不合规时在字段下方显示小红字
const uEl=document.getElementById('u');
uEl.addEventListener('input',()=>{
  const raw=uEl.value, v=raw.trim();
  if(raw&&(raw!==v||!USER_RE.test(v))){showUErr(USER_HINT);}else{hideUErr();}
});
// 两次输入不一致时实时提示；一致或尚未输入第二次时清除
function bindConfirm(firstId,secondId,label){
  const second=document.getElementById(secondId);
  second.addEventListener('input',()=>{
    if(second.value&&document.getElementById(firstId).value!==second.value){
      err(label+'两次输入不一致');
    }else if(second.value){
      clearErr();
    }
  });
}
bindConfirm('p','p2','密码');
async function verifyAm4(){
  const vmsg=document.getElementById('vmsg'), btn=document.getElementById('verifyBtn');
  const e=document.getElementById('e').value.trim(), pw=document.getElementById('pw').value;
  vmsg.className='msg vmsg'; vmsg.textContent='';
  if(!e||!pw){vmsg.className='msg vmsg err';vmsg.textContent='请先填写 AM4 邮箱和密码';return;}
  btn.disabled=true; btn.textContent='验证中…';
  try{
    const r=await fetch('/api/verify-am4',{method:'POST',
      headers:{'Content-Type':'application/json','X-CSRF-Token':CSRF},
      body:JSON.stringify({am4_email:e,am4_password:pw})});
    const d=await r.json();
    vmsg.className='msg vmsg '+(d.ok?'ok':'err');
    vmsg.textContent=d.msg||(d.ok?'验证通过':'验证失败');
  }catch(_){
    vmsg.className='msg vmsg err'; vmsg.textContent='网络错误，请重试';
  }finally{
    btn.disabled=false; btn.textContent='验证 AM4 账号（可选）';
  }
}
function reg(){
  const uRaw=document.getElementById('u').value, u=uRaw.trim(),
        p=document.getElementById('p').value,
        p2=document.getElementById('p2').value,
        e=document.getElementById('e').value.trim(),
        pw=document.getElementById('pw').value;
  clearErr(); hideUErr();
  if(!u||uRaw!==u||!USER_RE.test(u)){ showUErr(USER_HINT); return; }
  if(p.length<6){
    err('密码至少 6 个字符'); return;
  }
  if(p!==p2){
    err('两次输入的密码不一致'); return;
  }
  const msg=document.getElementById('msg');
  fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':CSRF},
    body:JSON.stringify({username:u,password:p,am4_email:e,am4_password:pw})})
    .then(r=>r.json().then(d=>({ok:r.ok,d})))
    .then(({ok,d})=>{
      msg.className='msg '+(ok?'ok':'err');
      msg.textContent=d.msg||(ok?'注册成功，请等待管理员审核':'注册失败');
      if(ok){ setTimeout(()=>location.href='/login',1500); }
    })
    .catch(()=>{ msg.className='msg err'; msg.textContent='网络错误，请重试'; });
}
</script>
</body>
</html>
