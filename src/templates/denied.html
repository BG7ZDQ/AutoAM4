<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>需要管理员权限 - AM4 机队中心</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--t:#1c2430;--t3:#8a93a3;--pri:#2563eb;--brd:#e2e6ef}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--t);
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:var(--card);border:1px solid var(--brd);border-radius:14px;box-shadow:0 8px 28px rgba(20,30,60,.08);
  padding:32px;width:100%;max-width:400px;text-align:center}
h1{font-size:1.3rem;margin-bottom:8px}
p{color:var(--t3);font-size:.9rem;margin-bottom:20px}
button{padding:10px 18px;border:0;border-radius:8px;background:var(--pri);color:#fff;font-size:.95rem;
  cursor:pointer;margin:0 6px}
button.ghost{background:transparent;border:1px solid var(--brd);color:var(--t)}
</style>
</head>
<body>
<div class="card">
  <h1>🔒 需要管理员权限</h1>
  <p>当前账号 <b>{{ username }}</b> 暂无管理员权限。<br>请使用管理员账号登录后访问管理面板。</p>
  <div>
    <button class="ghost" onclick="location.href='/'">返回主页</button>
    <button onclick="location.href='/login'">切换账号</button>
  </div>
</div>
</body>
</html>
