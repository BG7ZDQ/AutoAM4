<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>管理员 - AM4 机队中心</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--t:#1c2430;--t3:#8a93a3;--pri:#2563eb;--ok:#16a34a;--warn:#d97706;
  --err:#dc2626;--brd:#e2e6ef}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--t);padding:16px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.top h1{font-size:1.25rem}
.top .sp{flex:1}
button{border:0;border-radius:8px;padding:7px 12px;font-size:.85rem;cursor:pointer;color:#fff}
.btn-pri{background:var(--pri)}.btn-ok{background:var(--ok)}.btn-warn{background:var(--warn)}
.btn-err{background:var(--err)}.btn-ghost{background:#eef1f7;color:var(--t)}
.card{background:var(--card);border:1px solid var(--brd);border-radius:12px;padding:16px;margin-bottom:16px}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.75rem}
.badge.active{background:#dcfce7;color:var(--ok)}.badge.pending{background:#fef3c7;color:var(--warn)}
.badge.disabled{background:#fee2e2;color:var(--err)}.badge.admin{background:#dbeafe;color:var(--pri)}
.user-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:14px}
.user-card{background:var(--card);border:1px solid var(--brd);border-radius:12px;padding:14px;
  display:flex;flex-direction:row;align-items:flex-start;gap:12px}
.u-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.u-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.u-name{font-weight:700;font-size:1rem}
.u-mail{font-size:.82rem;color:var(--t2);min-width:0}
.u-time{font-size:.75rem;color:var(--t3)}
.u-ops{display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.u-ops button{padding:6px 10px;font-size:.78rem}
.mail-cell{display:block;max-width:200px;overflow-x:auto;white-space:nowrap;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.mail-cell::-webkit-scrollbar{display:none}
@media(max-width:480px){.user-cards{grid-template-columns:1fr}.card{padding:10px}}
</style>
</head>
<body>
<div class="top">
  <h1>🛠 管理员面板</h1>
  <span class="sp"></span>
  <button class="btn-ghost" onclick="logout()">退出</button>
</div>
<div class="card">
  <h3>用户与账号</h3>
  <div id="ub" class="user-cards"></div>
</div>
<script>
const CSRF = "{{ csrf_token }}";
function api(path, opts={}){
  opts.headers = Object.assign({'X-CSRF-Token':CSRF}, opts.headers||{});
  return fetch(path, opts).then(r=>r.json());
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function mailCell(e){e=String(e==null?'':e);if(!e)return'—';return'<span class="mail-cell" title="'+esc(e)+'">'+esc(e)+'</span>'}
function loadUsers(){
  api('/api/admin/users').then(d=>{
    const box=document.getElementById('ub');
    if(!d.ok){ box.innerHTML='<div style="color:var(--t3)">加载失败</div>'; return; }
    box.innerHTML = d.users.map(u=>{
      const st=esc(u.status), role=u.is_admin?'管理员':'用户';
      let ops='';
      if(!u.is_admin){
        ops+='<button class="btn-pri" onclick="enter('+u.id+')">进入</button>';
        if(u.status==='pending')ops+='<button class="btn-ok" onclick="setStatus('+u.id+',\'active\')">通过</button>';
        if(u.status!=='disabled')ops+='<button class="btn-warn" onclick="setStatus('+u.id+',\'disabled\')">停用</button>';
        if(u.status==='disabled')ops+='<button class="btn-ok" onclick="setStatus('+u.id+',\'active\')">启用</button>';
        ops+='<button class="btn-err" onclick="delUser('+u.id+')">删除</button>';
      }
      return '<div class="user-card">'+
        '<div class="u-info">'+
          '<div class="u-top"><span class="u-name">'+esc(u.username)+'</span>'+
          '<span class="badge '+(u.is_admin?'admin':'')+'">'+role+'</span>'+
          '<span class="badge '+st+'">'+esc(u.status)+'</span></div>'+
          '<div class="u-mail">'+mailCell(u.am4_email)+'</div>'+
          '<div class="u-time">注册于 '+new Date(u.created_at*1000).toLocaleString()+'</div>'+
        '</div>'+
        (u.is_admin?'':'<div class="u-ops">'+ops+'</div>')+
        '</div>';
    }).join('');
  });
}
function setStatus(id,status){
  api('/api/admin/users/'+id+'/status',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({status})}).then(d=>{ if(d.ok) loadUsers(); else alert(d.msg); });
}
function delUser(id){
  if(!confirm('确定删除该用户及其账号数据？')) return;
  api('/api/admin/users/'+id,{method:'DELETE'}).then(d=>{ if(d.ok) loadUsers(); else alert(d.msg); });
}
function enter(id){
  api('/api/admin/impersonate',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({user_id:id})}).then(d=>{ if(d.ok) location.href='/'; else alert(d.msg); });
}
function logout(){
  api('/api/logout',{method:'POST'}).then(()=>location.href='/login');
}
loadUsers();
</script>
</body>
</html>
