server {
    listen 80;
    listen [::]:80;
    server_name am4.example.com;

    # 登录认证已由应用自身提供（登录页 + 会话），nginx 只负责 HTTPS 反代。
    # 部署时请用 certbot 配置 443，并把 80 重定向到 https。
    # 生产环境务必用下面的 443 示例替换本 80 直连配置，并保持
    # X-Forwarded-For / X-Forwarded-Proto 与 systemd 单元的 AM4_TRUST_PROXY=1 配套。

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }
}

